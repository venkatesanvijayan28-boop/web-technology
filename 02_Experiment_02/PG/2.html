Index.html
<!DOCTYPE html>
<html>
<head>
    <title>Three Frames Layout</title>
</head>
<frameset cols="20%, 60%, 20%">
    <frame src="contents.html" name="contents">
    <frame src="body.html" name="body">
    <frame src="remarks.html" name="remarks">
</frameset>
</html>
contents.html (Left Frame)
<html>
<head>
    <title>Contents</title>
</head>
<body>
    <h3>Contents</h3>
    <ul>
        <li>Introduction</li>
        <li>Services</li>
        <li>Contact</li>
    </ul>
</body>
</html>
body.html (Center Frame)
<!DOCTYPE html>
<html>
<head>
    <title>Body</title>
</head>
<body>
    <h2>Welcome to Our Website</h2>
    <p>This is the main content of the page.</p>
</body>
</html>

remarks.html (Right Frame)
<!DOCTYPE html>
<html>
<head>
    <title>Remarks</title>
</head>
<body>
    <h3>Remarks</h3>
    <p>Your feedback is valuable to us.</p>
</body>
</html>
